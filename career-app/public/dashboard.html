<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求上岸-投递进度追踪</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", "Liberation Mono", monospace;
    /* Core tokens */
    --color-bg-primary:#ffffff; --color-bg-secondary:#f5f5f3; --color-bg-tertiary:#efefed;
    --color-text-primary:#1a1a18; --color-text-secondary:#5a5a56; --color-text-tertiary:#9a9a94;
    --color-border-default:rgba(0,0,0,0.10); --color-border-strong:rgba(0,0,0,0.20);
    --color-accent:#1a1a18; --color-accent-hover:#3a3a38;
    --color-success-bg:#EAF3DE; --color-success-text:#27500A;
    --color-info-bg:#E6F1FB; --color-info-text:#0C447C;
    --color-warning-bg:#FAEEDA; --color-warning-text:#633806;
    --color-danger-bg:#FCEBEB; --color-danger-text:#791F1F;
    /* Type scale */
    --fs-h1:24px; --fs-h2:20px; --fs-h3:17px; --fs-h4:15px;
    --fs-body-lg:16px; --fs-body:14px; --fs-small:12px; --fs-caption:11px;
    --lh-base:1.6; --lh-relaxed:1.7;
    --fw-normal:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
    /* Radius */
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
    /* Legacy aliases */
    --bg:var(--color-bg-tertiary); --surface:var(--color-bg-primary); --surface2:var(--color-bg-secondary);
    --border:var(--color-border-default); --border2:var(--color-border-strong);
    --text:var(--color-text-primary); --text2:var(--color-text-secondary); --text3:var(--color-text-tertiary);
    --accent:var(--color-accent);
    --green:#2d6a4f; --green-bg:#d8f3dc; --amber:#92400e; --amber-bg:#fef3c7;
    --blue:#1e40af; --blue-bg:#dbeafe; --red:#991b1b; --red-bg:#fee2e2;
    --purple:#5b21b6; --purple-bg:#ede9fe; --gray:#374151; --gray-bg:#f3f4f6;
    --radius:8px; --radius-lg:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-sans);background:#808080;color:var(--text);min-height:100vh;font-size:14px;}

  .topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-weight:600;font-size:15px;letter-spacing:-0.3px;}
  .nav-divider{width:1px;height:20px;background:var(--border);}
  .nav-links{display:flex;gap:2px;}
  .nav-link{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--text2);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s;}
  .nav-link:hover{background:var(--surface2);color:var(--text);}
  .nav-link.active{background:var(--accent);color:white;}
  .nav-left{display:flex;align-items:center;gap:8px;}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--surface2);border-color:var(--border2);}
  .btn-primary{background:var(--accent);color:white;border-color:var(--accent);}
  .btn-primary:hover{opacity:.88;}
  .btn-sm{padding:4px 10px;font-size:12px;}
  .btn-board-compare{background:#5b21b6;color:#fff;border-color:#5b21b6;font-weight:700;}
  .btn-board-compare:hover{opacity:.9;}
  .btn-board-tracking{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:700;}
  .btn-board-tracking:hover{opacity:.9;}
  .btn-board-nav{height:32px;padding:0 14px;border-radius:8px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;}

  .header-tools{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .header-tools .tools-right{margin-left:auto;font-size:12px;color:var(--text3);}

  .stats-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:32px;align-items:center;}
  .stat{display:flex;flex-direction:column;gap:1px;}
  .stat-num{font-size:22px;font-weight:600;letter-spacing:-0.5px;line-height:1;}
  .stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
  .stat-divider{width:1px;height:32px;background:var(--border);}

  .toolbar{padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .view-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:7px;overflow:hidden;padding:2px;gap:2px;}
  .view-btn{padding:5px 12px;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;border-radius:5px;color:var(--text2);font-family:inherit;transition:all .15s;}
  .view-btn.active{background:var(--accent);color:white;}
  .filter-select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text);font-family:inherit;cursor:pointer;}
  .search-input{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-family:inherit;color:var(--text);width:200px;outline:none;transition:border-color .15s;}
  .search-input:focus{border-color:var(--accent);}

  .table-wrap{padding:0 24px 24px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);}
  thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;cursor:pointer;}
  thead th:hover{color:var(--text);}
  thead th.no-sort{cursor:default;}
  thead th.no-sort:hover{color:var(--text3);}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--surface2);}
  tbody tr.dragging{opacity:.4;background:var(--surface2);}
  tbody tr.drag-over{border-top:2px solid var(--accent);}
  td{padding:10px 14px;font-size:13px;vertical-align:middle;}
  .td-drag{width:28px;cursor:grab;color:var(--text3);font-size:16px;text-align:center;user-select:none;}
  .td-drag:active{cursor:grabbing;}
  .td-num{font-family:var(--font-mono);font-size:12px;color:var(--text3);width:60px;}
  .td-num-edit{font-family:var(--font-mono);font-size:12px;color:var(--text3);display:flex;align-items:center;gap:4px;}
  .num-input{width:36px;padding:2px 4px;border:1px solid var(--border2);border-radius:4px;font-family:var(--font-mono);font-size:12px;text-align:center;background:var(--surface);color:var(--text);outline:none;}
  .num-input:focus{border-color:var(--accent);}
  .td-company{font-weight:500;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .td-role{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .td-score{font-family:var(--font-mono);font-weight:600;font-size:13px;}
  .td-url a{color:var(--blue);font-size:12px;text-decoration:none;font-family:var(--font-mono);}
  .td-url a:hover{text-decoration:underline;}

  /* STATUS BADGES — all distinct */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;}
  .badge-dot{width:6px;height:6px;border-radius:50%;}
  .status-pending   {background:#f3f4f6;color:#374151;}
  .status-preparing {background:#fef3c7;color:#92400e;}
  .status-applied   {background:#dbeafe;color:#1e40af;}
  .status-no-reply  {background:#e2e8f0;color:#475569;}
  .status-replied   {background:#d8f3dc;color:#2d6a4f;}
  .status-interview {background:#ede9fe;color:#5b21b6;}
  .status-rejected  {background:#fee2e2;color:#991b1b;}

  .type-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
  .type-landscape {background:#d1fae5;color:#065f46;}
  .type-project   {background:#dbeafe;color:#1e40af;}
  .type-government{background:#fef3c7;color:#92400e;}
  .type-bim       {background:#ede9fe;color:#5b21b6;}
  .type-digital   {background:#fce7f3;color:#9d174d;}
  .type-admin     {background:#f3f4f6;color:#374151;}
  .type-ai        {background:#e0f2fe;color:#0369a1;}
  .type-other     {background:#f9fafb;color:#6b7280;}

  .score-high{color:#065f46;}
  .score-mid {color:#92400e;}
  .score-low {color:#991b1b;}
  .score-none{color:var(--text3);}

  .kanban-wrap{padding:0 24px 24px;display:none;overflow-x:auto;}
  .kanban-board{display:flex;gap:14px;min-width:max-content;}
  .kanban-col{width:240px;flex-shrink:0;}
  .kanban-header{padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .kanban-count{background:rgba(0,0,0,.1);padding:1px 7px;border-radius:20px;font-size:11px;}
  .kanban-cards{display:flex;flex-direction:column;gap:8px;min-height:200px;}
  .kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;}
  .kanban-card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px);}
  .kc-company{font-size:11px;color:var(--text3);margin-bottom:3px;}
  .kc-role{font-size:13px;font-weight:500;margin-bottom:8px;line-height:1.3;}
  .kc-footer{display:flex;justify-content:space-between;align-items:center;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.2);}
  .modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:10;border-radius:14px 14px 0 0;}
  .modal-title{font-size:17px;font-weight:600;letter-spacing:-0.3px;}
  .modal-company{font-size:13px;color:var(--text2);margin-top:2px;}
  .modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-family:inherit;flex-shrink:0;}
  .modal-close:hover{background:var(--surface2);}
  .modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
  .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);display:block;margin-bottom:6px;}
  .modal-input,.modal-select,.modal-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;}
  .modal-input:focus,.modal-select:focus,.modal-textarea:focus{border-color:var(--accent);}
  .modal-textarea{resize:vertical;min-height:80px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

  .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--accent);color:white;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:slideIn .2s ease;display:flex;align-items:center;gap:8px;}
  @keyframes slideIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes slideOut{from{opacity:1}to{opacity:0}}

  .deadline-near{color:#b45309;font-weight:500;}
  .deadline-past{color:#991b1b;}

  /* iOS-like liquid glass scrollbar */
  *{
    scrollbar-width:thin;
    scrollbar-color:rgba(226,232,240,.55) rgba(255,255,255,.32);
  }
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{
    background:rgba(255,255,255,.24);
    border-radius:999px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
  }
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg, rgba(243,244,246,.92) 0%, rgba(203,213,225,.78) 55%, rgba(156,163,175,.72) 100%);
    border-radius:999px;
    border:2px solid rgba(255,255,255,.38);
    box-shadow:
      0 2px 5px rgba(31,41,55,.18),
      0 0 0 1px rgba(255,255,255,.38),
      inset 0 1px 0 rgba(255,255,255,.76),
      inset 0 -1px 1px rgba(107,114,128,.24);
  }
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg, rgba(248,250,252,.96) 0%, rgba(226,232,240,.84) 58%, rgba(148,163,184,.74) 100%);}

  /* Liquid Glass V2 — visual only */
  body{
    background:
      radial-gradient(1200px 620px at 15% -15%, rgba(255,228,191,.45), transparent 62%),
      radial-gradient(1000px 560px at 110% 120%, rgba(255,170,96,.22), transparent 60%),
      #f5f4f0;
  }
  .topnav,
  .header-tools,
  .stats-bar,
  .toolbar,
  table,
  .modal,
  .modal-header,
  .modal-footer,
  .kanban-card{
    background:
      linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.10)) padding-box,
      linear-gradient(135deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.10) 52%, rgba(255,255,255,.50) 100%) border-box !important;
    border:1.2px solid transparent !important;
    backdrop-filter:blur(28px) saturate(130%);
    -webkit-backdrop-filter:blur(28px) saturate(130%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.40),
      inset 0 0 0 1px rgba(255,255,255,.15),
      0 14px 28px rgba(15,23,42,.12);
  }
  .btn,
  .view-toggle,
  .search-input,
  .filter-select,
  .modal-input,
  .modal-select,
  .modal-textarea{
    background:
      linear-gradient(rgba(255,255,255,.20), rgba(255,255,255,.12)) padding-box,
      linear-gradient(135deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.10) 52%, rgba(255,255,255,.50) 100%) border-box !important;
    border:1px solid transparent !important;
    backdrop-filter:blur(24px) saturate(125%);
    -webkit-backdrop-filter:blur(24px) saturate(125%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.40),
      inset 0 0 0 1px rgba(255,255,255,.15),
      0 3px 7px rgba(15,23,42,.14);
  }
  button,.btn{color:#111;}
  .btn-black-solid{
    background:#050505 !important;
    color:#fff !important;
    border-color:#050505 !important;
    box-shadow:0 3px 8px rgba(0,0,0,.42) !important;
  }
  .btn-black-solid:hover:not(:disabled){filter:brightness(1.06);}
  /* Shadow policy: keep only functional buttons */
  .topnav,.header-tools,.stats-bar,.toolbar,table,.modal,.modal-header,.modal-footer,.kanban-card,
  .view-toggle,.search-input,.filter-select,.modal-input,.modal-select,.modal-textarea,.toast{
    box-shadow:none !important;
  }
  ::-webkit-scrollbar-thumb{box-shadow:none !important;}
  button,.btn{
    box-shadow:0 3px 5px rgba(0,0,0,.42) !important;
  }
  button:hover:not(:disabled),.btn:hover:not(:disabled){
    box-shadow:0 4px 6px rgba(0,0,0,.46) !important;
  }
  /* Background image */
  body{
    background:url('1-2-Test1.png') center center / cover fixed no-repeat !important;
    position:relative;
    overflow-x:hidden;
  }
  body > *{position:relative;z-index:1;}
</style>
</head>
<body>

<nav class="topnav">
  <span class="nav-logo">求职助手</span>
  <div class="nav-left">
    <button class="btn btn-board-nav" onclick="goBackToJdAnalysis()">⬅️返回 Step2 JD分析</button>
  </div>
  <div class="nav-right">
    <button class="btn btn-board-nav btn-board-compare btn-black-solid" onclick="openCompareBoard()">⬅️返回 JD对比看板</button>
  </div>
</nav>

<div class="header-tools">
  <span class="tools-right" id="filter-count-top"></span>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">总职位</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num" id="stat-applied" style="color:#1e40af">0</div><div class="stat-label">已投递</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num" id="stat-replied" style="color:#2d6a4f">0</div><div class="stat-label">有回音</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num" id="stat-interview" style="color:#5b21b6">0</div><div class="stat-label">面试中</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num" id="stat-rate" style="color:#92400e">0%</div><div class="stat-label">回复率</div></div>
</div>

<div class="toolbar">
  <div class="view-toggle">
    <button class="view-btn active" id="btn-table" onclick="switchView('table')">☰ 表格</button>
    <button class="view-btn" id="btn-kanban" onclick="switchView('kanban')">⊞ 看板</button>
  </div>
  <input class="search-input" type="text" placeholder="搜索公司或职位..." oninput="applyFilter()" id="search-input">
  <select class="filter-select" id="filter-status" onchange="applyFilter()">
    <option value="">全部状态</option>
    <option value="未申请">未申请</option>
    <option value="准备中">准备中</option>
    <option value="已申请">已申请</option>
    <option value="无音讯">无音讯</option>
    <option value="有回音">有回音</option>
    <option value="面试中">面试中</option>
    <option value="失败">失败</option>
  </select>
  <select class="filter-select" id="filter-type" onchange="applyFilter()">
    <option value="">全部方向</option>
    <option value="Landscape/Urban Design">Landscape/Urban</option>
    <option value="Project management">Project Management</option>
    <option value="Government">Government</option>
    <option value="BIM">BIM</option>
    <option value="Digital Visual">Digital Visual</option>
    <option value="Admin">Admin</option>
    <option value="AI">AI</option>
  </select>
  <button class="btn btn-sm" onclick="sortByOrder()" title="按序号排序">⇅ 序号排序</button>
  <span style="margin-left:auto;font-size:12px;color:var(--text3)" id="filter-count"></span>
</div>

<div class="table-wrap" id="view-table">
  <table id="main-table">
    <thead>
      <tr>
        <th class="no-sort" style="width:28px"></th>
        <th onclick="sortBy('order')" title="点击排序，或直接编辑序号"># ↕</th>
        <th onclick="sortBy('company')">公司名称 ↕</th>
        <th onclick="sortBy('role')">职位名称 ↕</th>
        <th onclick="sortBy('deadline')">截止日期 ↕</th>
        <th onclick="sortBy('applied_date')">投递时间 ↕</th>
        <th onclick="sortBy('status')">申请状态 ↕</th>
        <th onclick="sortBy('type')">方向类型 ↕</th>
        <th onclick="sortBy('ai_grade')">AI投递评级 ↕</th>
        <th onclick="sortBy('salary')">薪资 ↕</th>
        <th>备注</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="kanban-wrap" id="view-kanban">
  <div class="kanban-board" id="kanban-board"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">新增职位</div>
        <div class="modal-company" id="modal-subtitle">填写职位基本信息</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="field-id">
      <div class="modal-row">
        <div class="modal-field">
          <label>公司名称 *</label>
          <input class="modal-input" id="field-company" placeholder="e.g. City of Melbourne" readonly>
        </div>
        <div class="modal-field">
          <label>职位名称 *</label>
          <input class="modal-input" id="field-role" placeholder="e.g. Project Coordinator" readonly>
        </div>
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>职位位置</label>
          <input class="modal-input" id="field-location" placeholder="e.g. Melbourne CBD">
        </div>
        <div class="modal-field">
          <label>合同类型</label>
          <select class="modal-select" id="field-contract">
            <option value="">未知</option>
            <option value="Full time">Full Time</option>
            <option value="Part time">Part Time</option>

<script src="/career-user-storage-scope.js"></script>
<script>
const STORAGE_KEY = 'career_tracking_board_v1'
const COMPARE_KEY = 'career_compare_board_v1'
let jobs = []
let currentView = 'table'
let sortField = 'order'
let sortDir = 1
let editingId = null
let dragSrcId = null
let contextMenuId = null

function uid() { return 'j_' + Math.random().toString(36).slice(2,10) }

const seedData = []

function load() {
  try {
    const r=localStorage.getItem(STORAGE_KEY)
    if(r){jobs=JSON.parse(r); sanitizeNotes(); linkAndFilterByCompare(); save(); return}
  } catch(e){}
  jobs=seedData; save()
}
function save() { localStorage.setItem(STORAGE_KEY,JSON.stringify(jobs)) }
function sanitizeNotes() {
  jobs = jobs.map(j => {
    const n = (j.notes || '').trim()
    if (/^AI评级[:：]/.test(n)) return { ...j, notes: '' }
    return j
  })
}
function linkAndFilterByCompare() {
  let compare=[]
  try { compare = JSON.parse(localStorage.getItem(COMPARE_KEY) || '[]') } catch(e) {}
  const byId = new Map(compare.map(c => [c.id, c]))
  jobs = jobs.map(j => {
    if (j.source_compare_id && byId.has(j.source_compare_id)) return j
    const hit = compare.find(c =>
      (j.url && c.url && j.url === c.url) ||
      ((j.company||'') === (c.company||'') && (j.role||'') === (c.role||''))
    )
    return hit ? { ...j, source_compare_id: hit.id } : j
  }).filter(j => Boolean(j.source_compare_id))
}

// ── STATUS CONFIG ──────────────────────────────────────────────────────────
const STATUS_MAP = {
  '未申请':'status-pending',
  '准备中':'status-preparing',
  '已申请':'status-applied',
  '无音讯':'status-no-reply',
  '有回音':'status-replied',
  '面试中':'status-interview',
  '失败':'status-rejected',
}
const STATUS_DOT = {
  '未申请':'#9ca3af',
  '准备中':'#f59e0b',
  '已申请':'#3b82f6',
  '无音讯':'#94a3b8',
  '有回音':'#10b981',
  '面试中':'#8b5cf6',
  '失败':'#ef4444',
}
const TYPE_MAP = {
  'Landscape/Urban Design':'type-landscape',
  'Project management':'type-project',
  'Government':'type-government',
  'BIM':'type-bim',
  'Digital Visual':'type-digital',
  'Admin':'type-admin',
  'AI':'type-ai',
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scoreClass(s){if(!s&&s!==0)return'score-none';if(s>=75)return'score-high';if(s>=55)return'score-mid';return'score-low'}
function renderGrade(g){
  if(!g)return'<span style="color:var(--text3);font-size:12px">—</span>'
  const cfg={A:{bg:'#d1fae5',color:'#065f46'},B:{bg:'#dbeafe',color:'#1e40af'},C:{bg:'#fef3c7',color:'#92400e'},D:{bg:'#fee2e2',color:'#991b1b'}}
  const c=cfg[g]||{bg:'#f3f4f6',color:'#374151'}
  return`<span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:${c.bg};color:${c.color}">${g}</span>`
}
function deadlineStr(d){
  if(!d)return''
  const dt=new Date(d),now=new Date()
  const diff=Math.ceil((dt-now)/86400000)
  const str=dt.toLocaleDateString('en-AU',{month:'short',day:'numeric'})
  if(diff<0)return`<span class="deadline-past">${str} ⚠</span>`
  if(diff<=7)return`<span class="deadline-near">${str} !</span>`
  return str
}
function maxOrder(){return jobs.reduce((m,j)=>Math.max(m,j.order||0),0)}

// ── FILTER / SORT ─────────────────────────────────────────────────────────
function filteredJobs(){
  const q=document.getElementById('search-input').value.toLowerCase()
  const st=document.getElementById('filter-status').value
  const ty=document.getElementById('filter-type').value
  return jobs.filter(j=>{
    if(q&&!j.company.toLowerCase().includes(q)&&!j.role.toLowerCase().includes(q))return false
    if(st&&j.status!==st)return false
    if(ty&&j.type!==ty)return false
    return true
  }).sort((a,b)=>{
    const av=a[sortField]??'',bv=b[sortField]??''
    if(sortField==='order'){return(Number(av)||9999)-(Number(bv)||9999)}
    return av<bv?-sortDir:av>bv?sortDir:0
  })
}

function sortBy(f){if(sortField===f)sortDir*=-1;else{sortField=f;sortDir=f==='order'?1:-1};render()}
function sortByOrder(){sortField='order';sortDir=1;render();toast('已按序号排序','⇅')}
function applyFilter(){render()}

// ── STATS ─────────────────────────────────────────────────────────────────
function renderStats(){
  const total=jobs.length
  const applied=jobs.filter(j=>['已申请','无音讯','有回音','面试中'].includes(j.status)).length
  const replied=jobs.filter(j=>['有回音','面试中'].includes(j.status)).length
  const interview=jobs.filter(j=>j.status==='面试中').length
  const rate=applied>0?Math.round(replied/applied*100):0
  document.getElementById('stat-total').textContent=total
  document.getElementById('stat-applied').textContent=applied
  document.getElementById('stat-replied').textContent=replied
  document.getElementById('stat-interview').textContent=interview
  document.getElementById('stat-rate').textContent=rate+'%'
}

// ── TABLE ─────────────────────────────────────────────────────────────────
function renderTable(){
  const list=filteredJobs()
  const counterText = `${list.length} / ${jobs.length} 条`
  document.getElementById('filter-count').textContent = counterText
  const topCounter = document.getElementById('filter-count-top')
  if (topCounter) topCounter.textContent = counterText
  const tbody=document.getElementById('table-body')
  if(!list.length){
    tbody.innerHTML=`<tr><td colspan="10"><div style="padding:60px;text-align:center;color:var(--text3)">没有找到职位</div></td></tr>`
    return
  }
  tbody.innerHTML=list.map(j=>{
    const typeClass=TYPE_MAP[j.type]||'type-other'
    const statusClass=STATUS_MAP[j.status]||'status-pending'
    const dot=STATUS_DOT[j.status]||'#9ca3af'
    const urlTxt=j.url?j.url.replace(/^https?:\/\//,'').slice(0,22)+'…':''
    const ord=j.order||''
    return `<tr draggable="true"
      oncontextmenu="openContextMenu(event,'${j.id}')"
      ondragstart="dragStart(event,'${j.id}')"
      ondragover="dragOver(event)"
      ondragleave="dragLeave(event)"
      ondrop="drop(event,'${j.id}')"
      ondragend="dragEnd(event)"
      onclick="openEditModal('${j.id}')">
      <td class="td-drag" onclick="event.stopPropagation()" title="拖拽调整顺序">⠿</td>
      <td class="td-num">
        <div class="td-num-edit" onclick="event.stopPropagation()">
          <input class="num-input" type="number" value="${ord}" min="1"
            onchange="changeOrder('${j.id}',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()"
            title="直接编辑序号">
        </div>
      </td>
      <td class="td-company">${esc(j.company)}</td>
      <td class="td-role">${esc(j.role)}</td>
      <td style="white-space:nowrap;font-size:12px">${deadlineStr(j.deadline)}</td>
      <td style="white-space:nowrap;font-size:12px;color:var(--text2)">${j.applied_date||''}</td>
      <td onclick="event.stopPropagation()">
        <select class="filter-select" style="padding:3px 8px;font-size:12px" onchange="updateInlineField('${j.id}','status',this.value)">
          <option value="未申请" ${j.status==='未申请'?'selected':''}>未申请</option>
          <option value="准备中" ${j.status==='准备中'?'selected':''}>准备中</option>
          <option value="已申请" ${j.status==='已申请'?'selected':''}>已申请</option>
          <option value="无音讯" ${j.status==='无音讯'?'selected':''}>无音讯</option>
          <option value="有回音" ${j.status==='有回音'?'selected':''}>有回音</option>
          <option value="面试中" ${j.status==='面试中'?'selected':''}>面试中</option>
          <option value="失败" ${j.status==='失败'?'selected':''}>失败</option>
        </select>
      </td>
      <td onclick="event.stopPropagation()">
        <select class="filter-select" style="padding:3px 8px;font-size:12px" onchange="updateInlineField('${j.id}','type',this.value)">
          <option value="" ${!j.type?'selected':''}>未分类</option>
          <option value="Landscape/Urban Design" ${j.type==='Landscape/Urban Design'?'selected':''}>Landscape/Urban</option>
          <option value="Project management" ${j.type==='Project management'?'selected':''}>Project management</option>
          <option value="Government" ${j.type==='Government'?'selected':''}>Government</option>
          <option value="BIM" ${j.type==='BIM'?'selected':''}>BIM</option>
          <option value="Digital Visual" ${j.type==='Digital Visual'?'selected':''}>Digital Visual</option>
          <option value="Admin" ${j.type==='Admin'?'selected':''}>Admin</option>
          <option value="AI" ${j.type==='AI'?'selected':''}>AI</option>
        </select>
      </td>
      <td>${renderGrade(j.ai_grade)}</td>
      <td style="font-size:12px;color:var(--text2);white-space:nowrap">${j.salary||''}</td>
      <td onclick="event.stopPropagation()">
        <input class="source-input" style="font-size:12px;padding:4px 8px;min-width:180px" value="${esc(j.notes)}"
          onfocus="this.dataset.old=this.value"
          onblur="if(this.dataset.old!==this.value) updateInlineField('${j.id}','notes',this.value)"
          onkeydown="if(event.key==='Enter'){this.blur()}">
      </td>
    </tr>`
  }).join('')
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────
function dragStart(e,id){
  dragSrcId=id
  e.dataTransfer.effectAllowed='move'
  setTimeout(()=>e.target.classList.add('dragging'),0)
}
function dragOver(e){
  e.preventDefault()
  e.dataTransfer.dropEffect='move'
  const tr=e.currentTarget
  tr.classList.add('drag-over')
}
function dragLeave(e){e.currentTarget.classList.remove('drag-over')}
function dragEnd(e){e.target.classList.remove('dragging')}
function drop(e,targetId){
  e.preventDefault()
  e.currentTarget.classList.remove('drag-over')
  if(dragSrcId===targetId)return
  const list=filteredJobs()
  const srcIdx=list.findIndex(j=>j.id===dragSrcId)
  const tgtIdx=list.findIndex(j=>j.id===targetId)
  if(srcIdx<0||tgtIdx<0)return
  // Swap orders
  const srcOrder=list[srcIdx].order
  const tgtOrder=list[tgtIdx].order
  const srcJob=jobs.find(j=>j.id===dragSrcId)
  const tgtJob=jobs.find(j=>j.id===targetId)
  if(srcJob)srcJob.order=tgtOrder
  if(tgtJob)tgtJob.order=srcOrder
  save(); render()
  toast('顺序已更新','✓')
}

// ── ORDER EDIT ────────────────────────────────────────────────────────────
function changeOrder(id,val){
  const n=parseInt(val)
  if(isNaN(n)||n<1)return
  const job=jobs.find(j=>j.id===id)
  if(!job)return
  job.order=n
  save(); render()
}

// ── KANBAN ────────────────────────────────────────────────────────────────
const KANBAN_COLS=[
  {key:'未申请',label:'待决定',color:'#f3f4f6',textColor:'#374151'},
  {key:'准备中',label:'准备材料',color:'#fef3c7',textColor:'#92400e'},
  {key:'已申请',label:'已投递',color:'#dbeafe',textColor:'#1e40af'},
  {key:'无音讯',label:'无音讯',color:'#e2e8f0',textColor:'#475569'},
  {key:'有回音',label:'有回音 ✓',color:'#d1fae5',textColor:'#065f46'},
  {key:'面试中',label:'面试中 🎯',color:'#ede9fe',textColor:'#5b21b6'},
  {key:'失败',label:'已结束',color:'#fee2e2',textColor:'#991b1b'},
]

function renderKanban(){
  const list=filteredJobs()
  const board=document.getElementById('kanban-board')
  board.innerHTML=KANBAN_COLS.map(col=>{
    const cards=list.filter(j=>j.status===col.key)
    const cardsHtml=cards.length?cards.map(j=>{
      const typeClass=TYPE_MAP[j.type]||'type-other'
      const scClass=scoreClass(j.score)
      return`<div class="kanban-card" onclick="openEditModal('${j.id}')" oncontextmenu="openContextMenu(event,'${j.id}')">
        <div class="kc-company">${esc(j.company)}</div>
        <div class="kc-role">${esc(j.role||'（未填职位）')}</div>
        <div class="kc-footer">
          <span>${j.type?`<span class="type-badge ${typeClass}" style="font-size:10px;padding:1px 6px">${esc(j.type)}</span>`:''}</span>
          <span class="${scClass}" style="font-family:var(--font-mono);font-size:12px;font-weight:600">${j.score!=null?j.score:''}</span>
        </div>
        ${j.deadline?`<div style="margin-top:6px;font-size:11px">${deadlineStr(j.deadline)}</div>`:''}
      </div>`
    }).join(''):`<div style="padding:20px 12px;text-align:center;font-size:12px;color:var(--text3)">暂无</div>`
    return`<div class="kanban-col">
      <div class="kanban-header" style="background:${col.color};color:${col.textColor}">
        <span>${col.label}</span><span class="kanban-count">${cards.length}</span>
      </div>
      <div class="kanban-cards">${cardsHtml}</div>
    </div>`
  }).join('')
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  // 追踪看板仅保留来自JD对比看板的条目
  linkAndFilterByCompare()
  save()
  renderStats()
  if(currentView==='table')renderTable()
  else renderKanban()
}

function switchView(v){
  currentView=v
  document.getElementById('view-table').style.display=v==='table'?'block':'none'
  document.getElementById('view-kanban').style.display=v==='kanban'?'block':'none'
  document.getElementById('btn-table').classList.toggle('active',v==='table')
  document.getElementById('btn-kanban').classList.toggle('active',v==='kanban')
  render()
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openAddModal(){
  editingId=null
  document.getElementById('modal-title').textContent='新增职位'
  document.getElementById('modal-subtitle').textContent='填写职位基本信息'
  document.getElementById('btn-delete').style.display='none'
  clearModal()
  document.getElementById('modal-overlay').classList.add('open')
}
function openEditModal(id){
  editingId=id
  const j=jobs.find(x=>x.id===id)
  if(!j)return
  document.getElementById('modal-title').textContent=j.role||'编辑职位'
  document.getElementById('modal-subtitle').textContent=j.company
  document.getElementById('btn-delete').style.display='block'
  document.getElementById('field-id').value=j.id
  document.getElementById('field-company').value=j.company||''
  document.getElementById('field-role').value=j.role||''
  document.getElementById('field-location').value=j.location||''
  document.getElementById('field-contract').value=j.contract||''
  document.getElementById('field-deadline').value=j.deadline||''
  document.getElementById('field-applied-date').value=j.applied_date||''
  document.getElementById('field-status').value=j.status||'未申请'
  document.getElementById('field-type').value=j.type||''
  document.getElementById('field-score').value=j.score!=null?j.score:''
  document.getElementById('field-salary').value=j.salary||''
  document.getElementById('field-url').value=j.url||''
  document.getElementById('field-jd').value=j.jd||''
  document.getElementById('field-notes').value=j.notes||''
  document.getElementById('modal-overlay').classList.add('open')
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null}
function handleOverlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal()}
function clearModal(){
  ['field-company','field-role','field-location','field-deadline','field-applied-date','field-url','field-jd','field-notes'].forEach(id=>{document.getElementById(id).value=''})
  document.getElementById('field-contract').value=''
  document.getElementById('field-status').value='未申请'
  document.getElementById('field-type').value=''
  document.getElementById('field-score').value=''
  document.getElementById('field-salary').value=''
}
function saveJob(){
  const existing = editingId ? jobs.find(j=>j.id===editingId) : null
  const company=(existing?.company || document.getElementById('field-company').value || '').trim()
  if(!company){toast('请填写公司名称','⚠');return}
  const role=(existing?.role || document.getElementById('field-role').value || '').trim()
  const scoreRaw=document.getElementById('field-score').value
  const job={
    id:editingId||uid(),
    order:editingId?(jobs.find(j=>j.id===editingId)?.order||maxOrder()+1):maxOrder()+1,
    company,
    role,
    location:document.getElementById('field-location').value.trim(),
    contract:document.getElementById('field-contract').value,
    deadline:document.getElementById('field-deadline').value,
    applied_date:document.getElementById('field-applied-date').value,
    status:document.getElementById('field-status').value,
    type:document.getElementById('field-type').value,
    score:existing?.score!=null ? existing.score : (scoreRaw!==''?parseInt(scoreRaw):null),
    salary:document.getElementById('field-salary').value.trim(),
    url:document.getElementById('field-url').value.trim(),
    jd:document.getElementById('field-jd').value.trim(),
    resume_notes:existing?.resume_notes || '',
    notes:document.getElementById('field-notes').value.trim(),
  }
  if(editingId){const idx=jobs.findIndex(j=>j.id===editingId);if(idx>=0)jobs[idx]=job;toast('已更新','✓')}
  else{jobs.push(job);toast('已加入看板 #'+job.order,'✓')}
  save();render();closeModal()
}
function deleteJob(){
  if(!editingId)return
  if(!confirm('确认删除这条记录？'))return
  jobs=jobs.filter(j=>j.id!==editingId)
  save();render();closeModal();toast('已删除','✗')
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function toast(msg,icon='✓'){
  const wrap=document.getElementById('toast-wrap')
  const el=document.createElement('div')
  el.className='toast'
  el.innerHTML=`<span>${icon}</span><span>${msg}</span>`
  wrap.appendChild(el)
  setTimeout(()=>{el.style.animation='slideOut .3s ease forwards';setTimeout(()=>el.remove(),300)},2200)
}

}
function openTrash(){

}
function openCompareBoard(){

}
function openContextMenu(e, id){
  e.preventDefault()
  contextMenuId = id
  const menu = document.getElementById('ctx-menu')
  menu.style.display = 'block'
  menu.style.left = e.clientX + 'px'
  menu.style.top = e.clientY + 'px'
}

function hideContextMenu(){
  const menu = document.getElementById('ctx-menu')
  if (menu) menu.style.display = 'none'
  contextMenuId = null
}

function deleteByContextMenu(){
  if(!contextMenuId) return
  editingId = contextMenuId
  deleteJob()
  hideContextMenu()
}

function updateInlineField(id, field, value){
  const idx = jobs.findIndex(j => j.id === id)
  if (idx < 0) return
  jobs[idx][field] = value
  save()
  render()
}

// ── BACKUP / RESTORE ──────────────────────────────────────────────────────
function exportData(){
  const data={version:2,exported:new Date().toISOString(),jobs}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'})
  const a=document.createElement('a')
  a.href=URL.createObjectURL(blob)
  a.download='career_dashboard_'+new Date().toISOString().slice(0,10)+'.json'
  a.click()
  URL.revokeObjectURL(a.href)
  toast('已导出 '+jobs.length+' 条记录','↓')
}
function importData(e){
  const file=e.target.files[0]
  if(!file)return
  const reader=new FileReader()
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result)
      const imported=data.jobs||data
      if(!Array.isArray(imported))throw new Error('格式不对')
      if(!confirm('导入将覆盖当前 '+jobs.length+' 条数据，确认继续？'))return
      jobs=imported
      save();render()
      toast('已恢复 '+jobs.length+' 条记录','↑')
    }catch(err){
      toast('文件格式错误，请选择正确的备份文件','⚠')
    }
  }
  reader.readAsText(file)
  e.target.value=''
}

;(async function careerTrackingBoardBoot(){
  if (typeof window.__careerEnsureStorageUserScope === 'function') {
    await window.__careerEnsureStorageUserScope()
  }
  load();render()
})()
window.addEventListener('storage', () => { load(); render() })
document.addEventListener('click', hideContextMenu)
document.addEventListener('scroll', hideContextMenu, true)
</script>
